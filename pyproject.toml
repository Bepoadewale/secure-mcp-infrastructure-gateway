[project]
name="secure-mcp-infrastructure-gateway"
version="0.1.0"
requires-python=">=3.12"
dependencies=[
  "mcp>=2.0,<3",
]
[project.optional-dependencies]
dev=["pytest>=8.3,<9","ruff>=0.8,<1"]
[tool.pytest.ini_options]
pythonpath=["gateway/src"]
[tool.ruff]
line-length=100
target-version="py312"
[tool.setuptools]
package-dir={""="gateway/src"}
[tool.setuptools.packages.find]
where=["gateway/src"]
